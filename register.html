<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create Account — Techablers</title>
<meta name="description" content="Create Account to your Techablers client account." />
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,900&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
<link rel="stylesheet" href="assets/css/style.css" />
<script src="assets/js/content-data.js"></script>
<script src="assets/js/services-data.js"></script>
</head>
<body data-page="register">
<script src="assets/js/layout.js"></script>

<main>
  <section class="auth-page">
    <div class="container">
      <div class="text-center mb-4">
        <div id="authBrand" class="mb-3"></div>
        <p class="auth-tagline">Create your client account</p>
      </div>
      <div class="auth-card">
        <form data-auth novalidate>
          <p class="auth-error" role="alert" style="display:none;color:#f87171;font-size:.84rem;margin-bottom:1rem"></p>
          <div class="row g-3 mb-3">
            <div class="col-6"><label class="auth-label" for="firstName">First Name</label><input class="auth-input form-control" id="firstName" placeholder="Sara" required data-label="your first name" /></div>
            <div class="col-6"><label class="auth-label" for="lastName">Last Name</label><input class="auth-input form-control" id="lastName" placeholder="Khan" required data-label="your last name" /></div>
          </div>
          <div class="mb-3"><label class="auth-label" for="email">Email Address</label><input class="auth-input form-control" type="email" id="email" placeholder="you@example.com" required data-label="your email" /></div>
          <div class="mb-3"><label class="auth-label" for="company">Company Name <small>(optional)</small></label><input class="auth-input form-control" id="company" placeholder="Acme Inc." /></div>
          <div class="mb-3"><label class="auth-label" for="password">Password</label><div class="pw-wrap"><input class="auth-input form-control" type="password" id="password" placeholder="Min. 8 characters" required data-label="password" minlength="8" /><button type="button" class="pw-toggle" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
          <div class="mb-4"><label class="auth-label" for="confirmPassword">Confirm Password</label><div class="pw-wrap"><input class="auth-input form-control" type="password" id="confirmPassword" placeholder="••••••••" required data-label="password confirmation"  /><button type="button" class="pw-toggle" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
          <button type="submit" class="auth-btn"><i class="bi bi-person-plus me-2"></i>Create Account</button>
        </form>
      </div>
      <div class="text-center mt-4"><p class="auth-foot mb-0">Already have an account? <a class="auth-link" href="login.html">Sign in</a></p></div>
    </div>
  </section>
</main>

<script>TX.footer()</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>document.getElementById('authBrand').innerHTML = '<a class="brand" href="index.html" style="justify-content:center">' + TX.brandMark() + '<span class="brand-name" style="font-size:1.5rem">Tech<b>ablers</b></span></a>';</script>
<script src="assets/js/auth.js"></script>
</body>
</html>
