<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blog — Techablers</title>
<meta name="description" content="An article from the Techablers blog." />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="assets/img/brand/favicon-48.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,900&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
<link rel="stylesheet" href="assets/css/style.css" />
<script src="assets/js/content-data.js"></script>
<script src="assets/js/services-data.js"></script>
</head>
<body data-page="blog">
<script src="assets/js/layout.js"></script>

<main id="postMain"></main>

<script>TX.footer()</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
(function () {
  var e = TX.esc, slug = TX.param('p');
  var p = TX_BLOG.filter(function (x) { return x.slug === slug; })[0] || TX_BLOG[0];
  document.title = p.title + ' — Techablers';
  // p.body is trusted HTML authored in content-data.js
  document.getElementById('postMain').innerHTML =
    '<section class="doc-hero"><div class="container" style="max-width:860px">' +
      (p.tag ? '<span class="article-tag">' + e(p.tag) + '</span>' : '') +
      '<h1 class="doc-hero-title mb-3">' + e(p.title) + '</h1>' +
      '<div class="article-meta"><span><i class="bi bi-person me-1"></i>' + e(p.author) + '</span><span><i class="bi bi-calendar3 me-1"></i>' + e(p.date) + '</span><span><i class="bi bi-clock me-1"></i>' + Math.max(2, Math.round(p.body.split(/\s+/).length / 200)) + ' min read</span></div>' +
    '</div></section>' +
    '<section class="doc-section"><div class="container" style="max-width:860px">' +
      '<img class="article-cover" src="' + p.img.replace('w=1200', 'w=1600') + '" alt="" />' +
      '<div class="blog-content">' + p.body + '</div>' +
      '<hr class="section-divider my-5" />' +
      '<div class="d-flex flex-wrap gap-3 justify-content-between">' +
        '<a class="btn-tx-ghost" href="blog.html"><i class="bi bi-arrow-left me-1"></i> Back to Blog</a>' +
        '<a class="btn-tx-primary" href="contact.html">Work with us <i class="bi bi-arrow-right ms-1"></i></a>' +
      '</div>' +
    '</div></section>';
})();
</script>
</body>
</html>
