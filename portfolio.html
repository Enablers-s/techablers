<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio — Techablers</title>
<meta name="description" content="Selected digital products engineered by Techablers across industries." />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="assets/img/brand/favicon-48.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,900&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
<link rel="stylesheet" href="assets/css/style.css" />
<script src="assets/js/content-data.js"></script>
<script src="assets/js/services-data.js"></script>
</head>
<body data-page="portfolio">
<script src="assets/js/layout.js"></script>

<main>
  <section class="page-hero">
    <div class="container">
      <div data-aos="fade-up"><span class="section-tag"><i class="bi bi-grid-3x3-gap me-1"></i> Our Work</span></div>
      <h1 class="page-hero-title mt-3" data-aos="fade-up" data-aos-delay="80">Projects we're<br /><span class="accent">proud to show off.</span></h1>
      <p class="page-hero-subtitle" data-aos="fade-up" data-aos-delay="160">A curated selection of digital products we've engineered for clients across industries.</p>
    </div>
  </section>
  <hr class="section-divider" />
  <div class="container"><div class="filter-bar" id="filterBar"></div></div>
  <section class="section-py pt-3">
    <div class="container"><div class="row g-4" id="portfolioGrid"></div></div>
  </section>

  <section class="cta-section">
    <div class="container text-center" data-aos="fade-up">
      <div class="cta-eyebrow">Your project next?</div>
      <h2 class="cta-mega">Let's build your<br />success story.</h2>
      <p class="cta-sub">Free consultation. Custom quote within 120 minutes.</p>
      <a class="btn-tx-white btn-magnetic" href="contact.html">Start a Project <i class="bi bi-arrow-right ms-1"></i></a>
    </div>
  </section>
</main>

<script>TX.footer()</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
(function () {
  var e = TX.esc;
  var cats = TX_PORTFOLIO.map(function (p) { return p.cat; }).filter(function (c, i, a) { return a.indexOf(c) === i; }).sort();
  var current = TX.param('category') || 'All';
  var bar = document.getElementById('filterBar');
  bar.innerHTML = ['All'].concat(cats).map(function (c) { return '<button type="button" class="filter-btn" data-cat="' + e(c) + '">' + e(c) + '</button>'; }).join('');

  function render() {
    bar.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.toggle('is-active', b.dataset.cat === current); });
    var items = TX_PORTFOLIO.filter(function (p) { return current === 'All' || p.cat === current; });
    document.getElementById('portfolioGrid').innerHTML = items.map(function (p) {
      return '<div class="' + (p.featured ? 'col-md-6' : 'col-md-6 col-lg-4') + '"><div class="portfolio-card">' +
        '<div class="portfolio-card-img"><span class="ph-grid"></span><div class="portfolio-ph-icon"><i class="bi bi-' + p.icon + '"></i></div>' +
        '<div class="portfolio-stack">' + p.stack.map(function (s) { return '<span>' + e(s) + '</span>'; }).join('') + '</div>' +
        (p.featured ? '<span class="portfolio-card-featured-badge"><i class="bi bi-star-fill me-1"></i>Featured</span>' : '') + '</div>' +
        '<div class="portfolio-card-body"><div class="portfolio-cat-tag">' + e(p.cat) + '</div>' +
        '<h3 class="portfolio-card-title">' + e(p.title) + '</h3><p class="portfolio-card-excerpt">' + e(p.excerpt) + '</p>' +
        '<div class="portfolio-card-footer"><span><i class="bi bi-person me-1"></i>' + e(p.client) + '</span><span>' + e(p.date) + '</span></div></div></div></div>';
    }).join('');
  }
  bar.addEventListener('click', function (ev) {
    var b = ev.target.closest('.filter-btn'); if (!b) return;
    current = b.dataset.cat;
    history.replaceState(null, '', current === 'All' ? 'portfolio.html' : 'portfolio.html?category=' + encodeURIComponent(current));
    render();
  });
  render();
})();
</script>
</body>
</html>
